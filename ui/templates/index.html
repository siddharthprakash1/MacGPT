<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>macOS MCP Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Animated Background Particles */
        .bg-particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(100, 200, 255, 0.3);
            border-radius: 50%;
            animation: float 20s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); opacity: 0; }
            10% { opacity: 0.5; }
            50% { transform: translate(50vw, -50vh) scale(1.5); opacity: 0.3; }
            90% { opacity: 0.5; }
        }

        /* Header with Glassmorphism */
        .header {
            background: rgba(30, 30, 40, 0.7);
            backdrop-filter: blur(20px);
            padding: 20px 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            z-index: 100;
            animation: slideDown 0.6s ease-out;
        }

        @keyframes slideDown {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: glow 2s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.3); }
        }

        .model-info {
            display: flex;
            gap: 20px;
            align-items: center;
            font-size: 14px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(74, 222, 128, 0.1);
            border: 1px solid rgba(74, 222, 128, 0.3);
            border-radius: 20px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background: #4ade80;
            border-radius: 50%;
            box-shadow: 0 0 10px #4ade80;
            animation: blink 2s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .tool-count {
            padding: 6px 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            font-weight: 600;
            font-size: 12px;
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            animation: float-soft 3s ease-in-out infinite;
        }

        @keyframes float-soft {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-3px); }
        }

        /* Chat Container */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: relative;
            z-index: 10;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 80%;
            padding: 16px 20px;
            border-radius: 16px;
            line-height: 1.6;
            animation: slideIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s ease;
        }

        .message:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.4);
        }

        @keyframes slideIn {
            from { 
                opacity: 0; 
                transform: translateX(-20px) scale(0.95);
            }
            to { 
                opacity: 1; 
                transform: translateX(0) scale(1);
            }
        }

        .message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin-left: auto;
            animation: slideInRight 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes slideInRight {
            from { 
                opacity: 0; 
                transform: translateX(20px) scale(0.95);
            }
            to { 
                opacity: 1; 
                transform: translateX(0) scale(1);
            }
        }

        .message.assistant {
            align-self: flex-start;
            background: rgba(42, 42, 52, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .message.system {
            align-self: center;
            background: rgba(55, 65, 81, 0.8);
            backdrop-filter: blur(10px);
            color: #9ca3af;
            font-size: 13px;
            max-width: 60%;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .message.tool {
            align-self: flex-start;
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(10px);
            border-left: 4px solid #4ade80;
            font-size: 13px;
            max-width: 85%;
            padding: 0;
            overflow: hidden;
            animation: expandIn 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes expandIn {
            from { 
                opacity: 0;
                max-height: 0;
                transform: scaleY(0);
            }
            to { 
                opacity: 1;
                max-height: 1000px;
                transform: scaleY(1);
            }
        }

        .tool-header {
            padding: 12px 20px;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #4ade80;
            font-weight: 700;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid rgba(74, 222, 128, 0.2);
        }

        .tool-icon {
            width: 18px;
            height: 18px;
            animation: rotate 2s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .tool-body {
            padding: 16px 20px;
        }

        .tool-params, .tool-result {
            margin-bottom: 12px;
        }

        .tool-label {
            color: #94a3b8;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .tool-label::before {
            content: '▸';
            color: #4ade80;
            animation: blink 1.5s ease-in-out infinite;
        }

        .tool-content {
            background: rgba(15, 23, 42, 0.8);
            padding: 12px;
            border-radius: 8px;
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 12px;
            line-height: 1.6;
            color: #94a3b8;
            white-space: pre-wrap;
            word-wrap: break-word;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }

        .tool-content:hover {
            background: rgba(15, 23, 42, 1);
            border-color: rgba(74, 222, 128, 0.3);
        }

        .tool-result .tool-content {
            color: #4ade80;
        }

        .success-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 12px;
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
            color: #4ade80;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            box-shadow: 0 0 15px rgba(74, 222, 128, 0.4);
            animation: successPop 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes successPop {
            0% { transform: scale(0); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .error-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 12px;
            background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%);
            color: #fca5a5;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            box-shadow: 0 0 15px rgba(220, 38, 38, 0.4);
            animation: shake 0.5s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        /* Input Container with Glow */
        .input-container {
            padding: 25px 30px;
            background: rgba(30, 30, 40, 0.9);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            gap: 15px;
            box-shadow: 0 -8px 32px 0 rgba(0, 0, 0, 0.37);
            z-index: 100;
            position: relative;
        }

        #messageInput {
            flex: 1;
            padding: 16px 20px;
            background: rgba(26, 26, 36, 0.8);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #e0e0e0;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        #messageInput:focus {
            border-color: #667eea;
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.4);
            transform: translateY(-2px);
        }

        button {
            padding: 16px 32px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            position: relative;
            overflow: hidden;
        }

        button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        button:hover::before {
            width: 300px;
            height: 300px;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.6);
        }

        button:active {
            transform: translateY(-1px);
        }

        button:disabled {
            background: linear-gradient(135deg, #4b5563 0%, #374151 100%);
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .reset-btn, .tools-btn {
            padding: 10px 20px;
            font-size: 13px;
        }

        .reset-btn {
            background: linear-gradient(135deg, #6b7280 0%, #4b5563 100%);
        }

        .reset-btn:hover {
            background: linear-gradient(135deg, #9ca3af 0%, #6b7280 100%);
        }

        .tools-btn {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        }

        .tools-btn:hover {
            background: linear-gradient(135deg, #34d399 0%, #10b981 100%);
        }

        /* Loading Animation - Advanced */
        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 30px;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(102, 126, 234, 0.1);
            border-top-color: #667eea;
            border-right-color: #764ba2;
            border-radius: 50%;
            animation: spin 1s ease-in-out infinite;
            box-shadow: 0 0 30px rgba(102, 126, 234, 0.5);
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            color: #e0e0e0;
            font-size: 15px;
            font-weight: 600;
            text-align: center;
        }

        .loading-subtext {
            color: #94a3b8;
            font-size: 13px;
            text-align: center;
            animation: fadeInOut 2s ease-in-out infinite;
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        .loading-dots::after {
            content: '';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: ''; }
            40% { content: '.'; }
            60% { content: '..'; }
            80%, 100% { content: '...'; }
        }

        /* Progress Bar */
        .progress-bar {
            width: 200px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            animation: progress 2s ease-in-out infinite;
        }

        @keyframes progress {
            0% { width: 0%; }
            50% { width: 70%; }
            100% { width: 100%; }
        }

        /* Modal with Blur Effect */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease;
        }

        .modal.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: rgba(42, 42, 52, 0.95);
            backdrop-filter: blur(20px);
            padding: 35px;
            border-radius: 20px;
            max-width: 700px;
            max-height: 85vh;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            animation: scaleIn 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes scaleIn {
            from { 
                transform: scale(0.8);
                opacity: 0;
            }
            to { 
                transform: scale(1);
                opacity: 1;
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid rgba(102, 126, 234, 0.3);
        }

        .modal-header h2 {
            font-size: 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .close-btn {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            padding: 8px 16px;
            font-size: 20px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .close-btn:hover {
            background: rgba(239, 68, 68, 0.3);
            transform: rotate(90deg);
        }

        .tool-list {
            display: grid;
            gap: 12px;
        }

        .tool-item {
            padding: 16px;
            background: rgba(26, 26, 36, 0.8);
            border-radius: 12px;
            border-left: 4px solid #667eea;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .tool-item:hover {
            background: rgba(30, 30, 40, 0.9);
            border-left-color: #764ba2;
            transform: translateX(5px);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .tool-name {
            font-weight: 700;
            color: #667eea;
            margin-bottom: 6px;
            font-size: 14px;
        }

        .tool-desc {
            font-size: 13px;
            color: #94a3b8;
            line-height: 1.5;
        }

        /* Markdown Styling */
        .message.assistant h2,
        .message.assistant h3 {
            margin: 15px 0 10px 0;
            color: #667eea;
            font-size: 18px;
            animation: fadeIn 0.5s ease;
        }

        .message.assistant ul,
        .message.assistant ol {
            margin: 12px 0;
            padding-left: 25px;
        }

        .message.assistant li {
            margin: 8px 0;
            animation: slideIn 0.4s ease;
        }

        .message.assistant code {
            background: rgba(15, 23, 42, 0.8);
            padding: 3px 8px;
            border-radius: 6px;
            font-family: 'Monaco', monospace;
            font-size: 12px;
            color: #4ade80;
            border: 1px solid rgba(74, 222, 128, 0.2);
        }

        .message.assistant pre {
            background: rgba(15, 23, 42, 0.9);
            padding: 15px;
            border-radius: 10px;
            overflow-x: auto;
            margin: 15px 0;
            border: 1px solid rgba(102, 126, 234, 0.3);
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .message.assistant pre code {
            background: none;
            padding: 0;
            border: none;
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(26, 26, 36, 0.5);
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
        }

        /* Tooltip Effect */
        [title]:hover::after {
            content: attr(title);
            position: absolute;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 12px;
            white-space: nowrap;
            z-index: 1000;
            animation: fadeIn 0.3s ease;
        }

        /* Typing Indicator */
        .typing-indicator {
            display: flex;
            gap: 6px;
            padding: 12px;
        }

        .typing-dot {
            width: 10px;
            height: 10px;
            background: #667eea;
            border-radius: 50%;
            animation: typing 1.4s infinite ease-in-out;
        }

        .typing-dot:nth-child(1) { animation-delay: 0s; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.7; }
            30% { transform: translateY(-10px); opacity: 1; }
        }

        /* Shimmer Effect for Loading */
        .shimmer {
            background: linear-gradient(
                90deg,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0.1) 50%,
                rgba(255, 255, 255, 0) 100%
            );
            background-size: 200% 100%;
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        /* Send Button Special Effect */
        #sendBtn {
            position: relative;
            z-index: 1;
        }

        #sendBtn::after {
            content: '→';
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 20px;
            transition: all 0.3s ease;
        }

        #sendBtn:hover::after {
            right: 10px;
        }

        /* Pulse Animation for Status Dot */
        .status-dot::before {
            content: '';
            position: absolute;
            width: 10px;
            height: 10px;
            background: #4ade80;
            border-radius: 50%;
            animation: sonar 2s ease-in-out infinite;
        }

        @keyframes sonar {
            0% { 
                transform: scale(1);
                opacity: 1;
            }
            100% { 
                transform: scale(2.5);
                opacity: 0;
            }
        }

        /* Tool Execution Counter */
        .execution-counter {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(102, 126, 234, 0.2);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            color: #667eea;
            animation: fadeIn 0.5s ease;
        }

        /* Ripple Effect on Click */
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            transform: scale(0);
            animation: ripple-effect 0.6s ease-out;
        }

        @keyframes ripple-effect {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <!-- Animated Background Particles -->
    <script>
        for (let i = 0; i < 30; i++) {
            const particle = document.createElement('div');
            particle.className = 'bg-particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.top = Math.random() * 100 + '%';
            particle.style.animationDelay = Math.random() * 20 + 's';
            particle.style.animationDuration = (15 + Math.random() * 10) + 's';
            document.body.appendChild(particle);
        }
    </script>

    <div class="header">
        <h1>🤖 macOS MCP Assistant</h1>
        <div class="model-info">
            <div class="status-indicator">
                <div class="status-dot" style="position: relative;"></div>
                <span>{{ model }}</span>
            </div>
            <div class="tool-count">{{ tool_count }} tools</div>
            <button class="tools-btn" onclick="showTools()">📋 Tools</button>
            <button class="reset-btn" onclick="resetChat()">🔄 Reset</button>
        </div>
    </div>

    <div class="chat-container" id="chatContainer">
        <div class="message system">
            🎉 Welcome! I'm your macOS assistant with {{ tool_count }} powerful tools.
            Ask me to control your Mac, manage files, search the web, and more!
        </div>
    </div>

    <div class="input-container">
        <input 
            type="text" 
            id="messageInput" 
            placeholder="✨ Ask me to do something amazing on your Mac..."
            onkeypress="handleKeyPress(event)"
        >
        <button onclick="sendMessage()" id="sendBtn">Send</button>
    </div>

    <div class="modal" id="toolsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>🛠️ Available Tools</h2>
                <button class="close-btn" onclick="closeTools()">×</button>
            </div>
            <div class="tool-list" id="toolsList"></div>
        </div>
    </div>

    <script>
        let isLoading = false;
        let executionCount = 0;

        // Add ripple effect to buttons
        document.addEventListener('click', function(e) {
            if (e.target.tagName === 'BUTTON') {
                const ripple = document.createElement('span');
                ripple.className = 'ripple';
                const rect = e.target.getBoundingClientRect();
                ripple.style.left = (e.clientX - rect.left) + 'px';
                ripple.style.top = (e.clientY - rect.top) + 'px';
                e.target.appendChild(ripple);
                setTimeout(() => ripple.remove(), 600);
            }
        });

        function addMessage(content, type = 'assistant') {
            const chatContainer = document.getElementById('chatContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            
            // Parse markdown for assistant messages
            if (type === 'assistant') {
                messageDiv.innerHTML = parseMarkdown(content);
            } else {
                messageDiv.textContent = content;
            }
            
            chatContainer.appendChild(messageDiv);
            
            // Smooth scroll to bottom
            setTimeout(() => {
                chatContainer.scrollTo({
                    top: chatContainer.scrollHeight,
                    behavior: 'smooth'
                });
            }, 100);
        }

        function parseMarkdown(text) {
            let html = text;
            
            // Escape HTML first
            html = html.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            
            // Code blocks
            html = html.replace(/```(\w+)?\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
            
            // Inline code
            html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
            
            // Headers
            html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
            html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
            
            // Bold
            html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            
            // Lists
            html = html.replace(/^- (.+)$/gm, '<li>$1</li>');
            html = html.replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>');
            
            // Line breaks
            html = html.replace(/\n/g, '<br>');
            
            return html;
        }

        function addToolExecution(execution) {
            const chatContainer = document.getElementById('chatContainer');
            const toolDiv = document.createElement('div');
            toolDiv.className = 'message tool';
            
            executionCount++;
            
            const isSuccess = execution.result.success !== false;
            const badge = isSuccess ? 
                '<span class="success-badge">✓ SUCCESS</span>' : 
                '<span class="error-badge">✗ ERROR</span>';
            
            const paramsHtml = Object.keys(execution.params).length > 0 ?
                `<div class="tool-params">
                    <div class="tool-label">Parameters</div>
                    <div class="tool-content">${JSON.stringify(execution.params, null, 2)}</div>
                </div>` : '';
            
            toolDiv.innerHTML = `
                <div class="tool-header">
                    <svg class="tool-icon" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M11 3a1 1 0 10-2 0v1a1 1 0 102 0V3zM15.657 5.757a1 1 0 00-1.414-1.414l-.707.707a1 1 0 001.414 1.414l.707-.707zM18 10a1 1 0 01-1 1h-1a1 1 0 110-2h1a1 1 0 011 1zM5.05 6.464A1 1 0 106.464 5.05l-.707-.707a1 1 0 00-1.414 1.414l.707.707zM5 10a1 1 0 01-1 1H3a1 1 0 110-2h1a1 1 0 011 1zM8 16v-1h4v1a2 2 0 11-4 0zM12 14c.015-.34.208-.646.477-.859a4 4 0 10-4.954 0c.27.213.462.519.476.859h4.002z"/>
                    </svg>
                    🔧 ${execution.tool}
                    ${badge}
                    <div class="execution-counter">#${executionCount}</div>
                </div>
                <div class="tool-body">
                    ${paramsHtml}
                    <div class="tool-result">
                        <div class="tool-label">Result</div>
                        <div class="tool-content">${JSON.stringify(execution.result, null, 2)}</div>
                    </div>
                </div>
            `;
            
            chatContainer.appendChild(toolDiv);
            
            setTimeout(() => {
                chatContainer.scrollTo({
                    top: chatContainer.scrollHeight,
                    behavior: 'smooth'
                });
            }, 100);
        }

        function showLoading(message = 'Processing your request') {
            const chatContainer = document.getElementById('chatContainer');
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message assistant';
            loadingDiv.id = 'loadingIndicator';
            loadingDiv.innerHTML = `
                <div class="loading-container">
                    <div class="loading-spinner"></div>
                    <div class="loading-text">
                        <span class="loading-dots">${message}</span>
                    </div>
                    <div class="loading-subtext">This may take a moment...</div>
                    <div class="progress-bar">
                        <div class="progress-fill"></div>
                    </div>
                </div>
            `;
            chatContainer.appendChild(loadingDiv);
            
            setTimeout(() => {
                chatContainer.scrollTo({
                    top: chatContainer.scrollHeight,
                    behavior: 'smooth'
                });
            }, 100);
        }

        function updateLoading(message) {
            const loading = document.getElementById('loadingIndicator');
            if (loading) {
                const textElement = loading.querySelector('.loading-text .loading-dots');
                if (textElement) {
                    textElement.textContent = message;
                }
            }
        }

        function hideLoading() {
            const loading = document.getElementById('loadingIndicator');
            if (loading) {
                loading.style.animation = 'fadeOut 0.3s ease';
                setTimeout(() => loading.remove(), 300);
            }
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (!message || isLoading) return;

            // Add user message
            addMessage(message, 'user');
            input.value = '';

            // Determine loading message based on query
            let loadingMsg = 'Processing your request';
            const lowerMsg = message.toLowerCase();
            
            if (lowerMsg.includes('speed test') || lowerMsg.includes('download speed') || lowerMsg.includes('upload speed')) {
                loadingMsg = 'Running internet speed test (20-30 seconds)';
            } else if (lowerMsg.includes('download') && lowerMsg.includes('file')) {
                loadingMsg = 'Downloading file';
            } else if (lowerMsg.includes('compress') || lowerMsg.includes('zip')) {
                loadingMsg = 'Compressing files';
            } else if (lowerMsg.includes('extract') || lowerMsg.includes('unzip')) {
                loadingMsg = 'Extracting archive';
            } else if (lowerMsg.includes('backup')) {
                loadingMsg = 'Managing backup (may take a moment)';
            } else if (lowerMsg.includes('install') && (lowerMsg.includes('brew') || lowerMsg.includes('npm') || lowerMsg.includes('pip'))) {
                loadingMsg = 'Installing package';
            } else if (lowerMsg.includes('scrape') || lowerMsg.includes('website')) {
                loadingMsg = 'Fetching website data';
            } else if (lowerMsg.includes('convert') && (lowerMsg.includes('video') || lowerMsg.includes('image'))) {
                loadingMsg = 'Converting media file';
            } else if (lowerMsg.includes('database') || lowerMsg.includes('query') || lowerMsg.includes('sql')) {
                loadingMsg = 'Querying database';
            }

            // Show loading
            isLoading = true;
            const sendBtn = document.getElementById('sendBtn');
            sendBtn.disabled = true;
            sendBtn.innerHTML = '<div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>';
            showLoading(loadingMsg);

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });

                const data = await response.json();
                hideLoading();

                if (data.success) {
                    // Show tool executions first
                    if (data.tool_executions && data.tool_executions.length > 0) {
                        for (const exec of data.tool_executions) {
                            await new Promise(resolve => setTimeout(resolve, 150));
                            addToolExecution(exec);
                        }
                    }
                    
                    // Then show assistant response
                    if (data.response && data.response.trim()) {
                        await new Promise(resolve => setTimeout(resolve, 200));
                        addMessage(data.response, 'assistant');
                    }
                } else {
                    addMessage(`Error: ${data.error}`, 'system');
                }
            } catch (error) {
                hideLoading();
                addMessage(`Error: ${error.message}`, 'system');
            } finally {
                isLoading = false;
                sendBtn.disabled = false;
                sendBtn.innerHTML = 'Send';
                input.focus();
            }
        }

        async function resetChat() {
            try {
                const chatContainer = document.getElementById('chatContainer');
                chatContainer.style.animation = 'fadeOut 0.3s ease';
                
                await fetch('/api/reset', { method: 'POST' });
                
                setTimeout(() => {
                    chatContainer.innerHTML = `
                        <div class="message system">
                            🔄 Conversation reset. How can I help you?
                        </div>
                    `;
                    chatContainer.style.animation = 'fadeIn 0.5s ease';
                    executionCount = 0;
                }, 300);
            } catch (error) {
                addMessage(`Error resetting: ${error.message}`, 'system');
            }
        }

        async function showTools() {
            try {
                const response = await fetch('/api/tools');
                const data = await response.json();
                
                const toolsList = document.getElementById('toolsList');
                toolsList.innerHTML = data.tools.map((tool, index) => `
                    <div class="tool-item" style="animation-delay: ${index * 0.03}s">
                        <div class="tool-name">🔧 ${tool.name}</div>
                        <div class="tool-desc">${tool.description}</div>
                    </div>
                `).join('');
                
                document.getElementById('toolsModal').classList.add('active');
            } catch (error) {
                addMessage(`Error loading tools: ${error.message}`, 'system');
            }
        }

        function closeTools() {
            const modal = document.getElementById('toolsModal');
            const content = modal.querySelector('.modal-content');
            content.style.animation = 'scaleOut 0.3s ease';
            setTimeout(() => {
                modal.classList.remove('active');
                content.style.animation = '';
            }, 300);
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        // Close modal on background click
        document.getElementById('toolsModal').addEventListener('click', (e) => {
            if (e.target.id === 'toolsModal') closeTools();
        });

        // Focus input on load with animation
        window.addEventListener('load', () => {
            const input = document.getElementById('messageInput');
            input.focus();
            input.style.animation = 'pulse 2s ease-in-out';
        });

        // Add scale out animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes scaleOut {
                from { transform: scale(1); opacity: 1; }
                to { transform: scale(0.8); opacity: 0; }
            }
            @keyframes fadeOut {
                from { opacity: 1; }
                to { opacity: 0; }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
