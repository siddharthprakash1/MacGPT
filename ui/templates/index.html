<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MacGPT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0d0d0d;
            --bg-secondary: #171717;
            --bg-tertiary: #212121;
            --bg-hover: #2a2a2a;
            --border-color: #2e2e2e;
            --text-primary: #ececec;
            --text-secondary: #a1a1a1;
            --text-muted: #6b6b6b;
            --accent: #10a37f;
            --accent-hover: #0d8c6d;
            --user-bg: #2f2f2f;
            --error: #ef4444;
            --success: #10a37f;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Header - Minimal */
        .header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-icon {
            width: 28px;
            height: 28px;
            background: var(--accent);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .model-badge {
            font-size: 12px;
            color: var(--text-secondary);
            background: var(--bg-tertiary);
            padding: 4px 10px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .header-btn:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border-color: var(--text-muted);
        }

        .tool-count {
            font-size: 11px;
            background: var(--accent);
            color: white;
            padding: 2px 6px;
            border-radius: 10px;
            font-weight: 600;
        }

        /* Chat Container */
        .chat-wrapper {
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            scroll-behavior: smooth;
        }

        .chat-content {
            max-width: 768px;
            margin: 0 auto;
            padding: 24px 24px 100px;
        }

        /* Messages */
        .message {
            padding: 24px 0;
            animation: messageIn 0.3s ease;
        }

        @keyframes messageIn {
            from { 
                opacity: 0;
                transform: translateY(8px);
            }
            to { 
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message + .message {
            border-top: 1px solid var(--border-color);
        }

        .message-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .message-avatar {
            width: 28px;
            height: 28px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 600;
            flex-shrink: 0;
        }

        .message-avatar.user {
            background: var(--user-bg);
            color: var(--text-primary);
        }

        .message-avatar.assistant {
            background: var(--accent);
            color: white;
        }

        .message-sender {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .message-content {
            padding-left: 40px;
            color: var(--text-primary);
            font-size: 15px;
            line-height: 1.7;
        }

        .message-content p {
            margin-bottom: 12px;
        }

        .message-content p:last-child {
            margin-bottom: 0;
        }

        /* Tool Execution */
        .tool-execution {
            margin: 16px 0;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            animation: toolIn 0.25s ease;
        }

        @keyframes toolIn {
            from {
                opacity: 0;
                transform: scale(0.98);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .tool-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: var(--bg-tertiary);
            border-bottom: 1px solid var(--border-color);
        }

        .tool-name {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-primary);
        }

        .tool-icon {
            color: var(--accent);
            font-size: 14px;
        }

        .tool-status {
            font-size: 11px;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .tool-status.success {
            background: rgba(16, 163, 127, 0.15);
            color: var(--success);
        }

        .tool-status.error {
            background: rgba(239, 68, 68, 0.15);
            color: var(--error);
        }

        .tool-body {
            padding: 12px 16px;
        }

        .tool-section {
            margin-bottom: 12px;
        }

        .tool-section:last-child {
            margin-bottom: 0;
        }

        .tool-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .tool-code {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
            font-family: 'SF Mono', 'Fira Code', 'Monaco', monospace;
            font-size: 12px;
            line-height: 1.5;
            color: var(--text-secondary);
            white-space: pre-wrap;
            word-break: break-word;
            overflow-x: auto;
        }

        /* Code in messages */
        .message-content code {
            background: var(--bg-tertiary);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'SF Mono', 'Fira Code', 'Monaco', monospace;
            font-size: 13px;
            color: var(--accent);
        }

        .message-content pre {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            margin: 12px 0;
            overflow-x: auto;
        }

        .message-content pre code {
            background: none;
            padding: 0;
            color: var(--text-primary);
        }

        .message-content ul, .message-content ol {
            padding-left: 24px;
            margin: 12px 0;
        }

        .message-content li {
            margin: 6px 0;
        }

        .message-content strong {
            font-weight: 600;
            color: var(--text-primary);
        }

        /* Welcome Message */
        .welcome-message {
            text-align: center;
            padding: 60px 24px;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .welcome-icon {
            width: 48px;
            height: 48px;
            background: var(--accent);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 24px;
        }

        .welcome-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .welcome-subtitle {
            font-size: 15px;
            color: var(--text-secondary);
            max-width: 500px;
            margin: 0 auto;
            line-height: 1.6;
        }

        /* Input Area */
        .input-wrapper {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, var(--bg-primary) 20%);
            padding: 20px 24px 24px;
        }

        .input-container {
            max-width: 768px;
            margin: 0 auto;
            position: relative;
        }

        .input-box {
            display: flex;
            align-items: flex-end;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 16px;
            transition: all 0.2s ease;
        }

        .input-box:focus-within {
            border-color: var(--text-muted);
            box-shadow: 0 0 0 1px var(--text-muted);
        }

        #messageInput {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 15px;
            font-family: inherit;
            resize: none;
            outline: none;
            max-height: 200px;
            min-height: 24px;
            line-height: 1.5;
        }

        #messageInput::placeholder {
            color: var(--text-muted);
        }

        .send-btn {
            width: 32px;
            height: 32px;
            background: var(--accent);
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: 12px;
            flex-shrink: 0;
            transition: all 0.15s ease;
        }

        .send-btn:hover {
            background: var(--accent-hover);
        }

        .send-btn:disabled {
            background: var(--bg-tertiary);
            color: var(--text-muted);
            cursor: not-allowed;
        }

        .send-btn svg {
            width: 16px;
            height: 16px;
        }

        .input-hint {
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 10px;
        }

        /* Loading */
        .loading-dots {
            display: flex;
            gap: 4px;
            padding: 8px 0;
        }

        .loading-dot {
            width: 8px;
            height: 8px;
            background: var(--text-muted);
            border-radius: 50%;
            animation: loadingPulse 1.4s ease-in-out infinite;
        }

        .loading-dot:nth-child(1) { animation-delay: 0s; }
        .loading-dot:nth-child(2) { animation-delay: 0.2s; }
        .loading-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes loadingPulse {
            0%, 80%, 100% { 
                transform: scale(0.8);
                opacity: 0.5;
            }
            40% { 
                transform: scale(1);
                opacity: 1;
            }
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.75);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.2s ease;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            animation: modalIn 0.25s ease;
        }

        @keyframes modalIn {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(10px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .modal-title {
            font-size: 16px;
            font-weight: 600;
        }

        .modal-close {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 20px;
            cursor: pointer;
            padding: 4px;
            line-height: 1;
            transition: color 0.15s ease;
        }

        .modal-close:hover {
            color: var(--text-primary);
        }

        .modal-body {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
        }

        .tool-item {
            padding: 12px;
            border-radius: 8px;
            transition: background 0.15s ease;
            cursor: default;
        }

        .tool-item:hover {
            background: var(--bg-tertiary);
        }

        .tool-item-name {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .tool-item-name::before {
            content: '→';
            color: var(--accent);
            font-size: 12px;
        }

        .tool-item-desc {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.5;
            padding-left: 18px;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--bg-tertiary);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }

        /* Responsive */
        @media (max-width: 640px) {
            .header {
                padding: 12px 16px;
            }
            
            .chat-content {
                padding: 16px 16px 100px;
            }
            
            .input-wrapper {
                padding: 16px;
            }
            
            .message-content {
                padding-left: 0;
            }
            
            .model-badge {
                display: none;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-left">
            <div class="logo">
                <div class="logo-icon">⌘</div>
                <span>MacGPT</span>
            </div>
            <span class="model-badge">{{ model }}</span>
        </div>
        <div class="header-right">
            <button class="header-btn" onclick="showTools()">
                Tools
                <span class="tool-count">{{ tool_count }}</span>
            </button>
            <button class="header-btn" onclick="resetChat()">New Chat</button>
        </div>
    </header>

    <div class="chat-wrapper">
        <div class="chat-container" id="chatContainer">
            <div class="chat-content" id="chatContent">
                <div class="welcome-message">
                    <div class="welcome-icon">⌘</div>
                    <h1 class="welcome-title">MacGPT</h1>
                    <p class="welcome-subtitle">
                        Your intelligent macOS assistant with {{ tool_count }} automation tools. 
                        Control your Mac, manage files, search the web, and more using natural language.
                    </p>
                </div>
            </div>
        </div>
    </div>

    <div class="input-wrapper">
        <div class="input-container">
            <div class="input-box">
                <textarea 
                    id="messageInput" 
                    placeholder="Message MacGPT..."
                    rows="1"
                    onkeydown="handleKeyDown(event)"
                    oninput="autoResize(this)"
                ></textarea>
                <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 2L11 13M22 2L15 22L11 13M11 13L2 9L22 2"/>
                    </svg>
                </button>
            </div>
            <div class="input-hint">MacGPT can execute commands on your Mac</div>
        </div>
    </div>

    <div class="modal-overlay" id="toolsModal">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title">Available Tools</h2>
                <button class="modal-close" onclick="closeTools()">×</button>
            </div>
            <div class="modal-body" id="toolsList"></div>
        </div>
    </div>

    <script>
        let isLoading = false;
        let hasMessages = false;

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 200) + 'px';
        }

        function parseMarkdown(text) {
            let html = text;
            html = html.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            html = html.replace(/```(\w+)?\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
            html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
            html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
            html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
            html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            html = html.replace(/^- (.+)$/gm, '<li>$1</li>');
            html = html.replace(/\n\n/g, '</p><p>');
            html = '<p>' + html + '</p>';
            html = html.replace(/<p><\/p>/g, '');
            return html;
        }

        function addMessage(content, type = 'assistant') {
            const chatContent = document.getElementById('chatContent');
            
            if (!hasMessages) {
                chatContent.innerHTML = '';
                hasMessages = true;
            }

            const messageDiv = document.createElement('div');
            messageDiv.className = 'message';

            const avatar = type === 'user' ? 'You' : '⌘';
            const avatarClass = type === 'user' ? 'user' : 'assistant';
            const senderName = type === 'user' ? 'You' : 'MacGPT';

            messageDiv.innerHTML = `
                <div class="message-header">
                    <div class="message-avatar ${avatarClass}">${avatar.charAt(0)}</div>
                    <span class="message-sender">${senderName}</span>
                </div>
                <div class="message-content">
                    ${type === 'assistant' ? parseMarkdown(content) : '<p>' + content.replace(/\n/g, '<br>') + '</p>'}
                </div>
            `;

            chatContent.appendChild(messageDiv);
            scrollToBottom();
        }

        function addToolExecution(execution) {
            const chatContent = document.getElementById('chatContent');
            
            // Find the last assistant message or create container
            let lastMessage = chatContent.querySelector('.message:last-child');
            let toolContainer;

            if (lastMessage && !lastMessage.querySelector('.message-avatar.user')) {
                toolContainer = lastMessage.querySelector('.message-content');
            } else {
                // Create new assistant message for tools
                const messageDiv = document.createElement('div');
                messageDiv.className = 'message';
                messageDiv.innerHTML = `
                    <div class="message-header">
                        <div class="message-avatar assistant">⌘</div>
                        <span class="message-sender">MacGPT</span>
                    </div>
                    <div class="message-content"></div>
                `;
                chatContent.appendChild(messageDiv);
                toolContainer = messageDiv.querySelector('.message-content');
                hasMessages = true;
            }

            const isSuccess = execution.result.success !== false;
            const toolDiv = document.createElement('div');
            toolDiv.className = 'tool-execution';

            const paramsHtml = Object.keys(execution.params).length > 0 
                ? `<div class="tool-section">
                    <div class="tool-label">Parameters</div>
                    <div class="tool-code">${JSON.stringify(execution.params, null, 2)}</div>
                   </div>`
                : '';

            toolDiv.innerHTML = `
                <div class="tool-header">
                    <div class="tool-name">
                        <span class="tool-icon">⚡</span>
                        ${execution.tool}
                    </div>
                    <span class="tool-status ${isSuccess ? 'success' : 'error'}">
                        ${isSuccess ? 'Success' : 'Error'}
                    </span>
                </div>
                <div class="tool-body">
                    ${paramsHtml}
                    <div class="tool-section">
                        <div class="tool-label">Result</div>
                        <div class="tool-code">${JSON.stringify(execution.result, null, 2)}</div>
                    </div>
                </div>
            `;

            toolContainer.appendChild(toolDiv);
            scrollToBottom();
        }

        function showLoading() {
            const chatContent = document.getElementById('chatContent');
            
            if (!hasMessages) {
                chatContent.innerHTML = '';
                hasMessages = true;
            }

            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message';
            loadingDiv.id = 'loadingMessage';
            loadingDiv.innerHTML = `
                <div class="message-header">
                    <div class="message-avatar assistant">⌘</div>
                    <span class="message-sender">MacGPT</span>
                </div>
                <div class="message-content">
                    <div class="loading-dots">
                        <div class="loading-dot"></div>
                        <div class="loading-dot"></div>
                        <div class="loading-dot"></div>
                    </div>
                </div>
            `;

            chatContent.appendChild(loadingDiv);
            scrollToBottom();
        }

        function hideLoading() {
            const loading = document.getElementById('loadingMessage');
            if (loading) loading.remove();
        }

        function scrollToBottom() {
            const container = document.getElementById('chatContainer');
            setTimeout(() => {
                container.scrollTo({
                    top: container.scrollHeight,
                    behavior: 'smooth'
                });
            }, 50);
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();

            if (!message || isLoading) return;

            addMessage(message, 'user');
            input.value = '';
            input.style.height = 'auto';

            isLoading = true;
            const sendBtn = document.getElementById('sendBtn');
            sendBtn.disabled = true;
            showLoading();

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });

                const data = await response.json();
                hideLoading();

                if (data.success) {
                    if (data.tool_executions && data.tool_executions.length > 0) {
                        for (const exec of data.tool_executions) {
                            await new Promise(resolve => setTimeout(resolve, 100));
                            addToolExecution(exec);
                        }
                    }

                    if (data.response && data.response.trim()) {
                        await new Promise(resolve => setTimeout(resolve, 150));
                        addMessage(data.response, 'assistant');
                    }
                } else {
                    addMessage(`Error: ${data.error}`, 'assistant');
                }
            } catch (error) {
                hideLoading();
                addMessage(`Connection error: ${error.message}`, 'assistant');
            } finally {
                isLoading = false;
                sendBtn.disabled = false;
                input.focus();
            }
        }

        async function resetChat() {
            try {
                await fetch('/api/reset', { method: 'POST' });
                hasMessages = false;
                document.getElementById('chatContent').innerHTML = `
                    <div class="welcome-message">
                        <div class="welcome-icon">⌘</div>
                        <h1 class="welcome-title">MacGPT</h1>
                        <p class="welcome-subtitle">
                            Your intelligent macOS assistant with {{ tool_count }} automation tools. 
                            Control your Mac, manage files, search the web, and more using natural language.
                        </p>
                    </div>
                `;
            } catch (error) {
                console.error('Reset error:', error);
            }
        }

        async function showTools() {
            try {
                const response = await fetch('/api/tools');
                const data = await response.json();

                const toolsList = document.getElementById('toolsList');
                toolsList.innerHTML = data.tools.map(tool => `
                    <div class="tool-item">
                        <div class="tool-item-name">${tool.name}</div>
                        <div class="tool-item-desc">${tool.description}</div>
                    </div>
                `).join('');

                document.getElementById('toolsModal').classList.add('active');
            } catch (error) {
                console.error('Error loading tools:', error);
            }
        }

        function closeTools() {
            document.getElementById('toolsModal').classList.remove('active');
        }

        function handleKeyDown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        // Close modal on overlay click
        document.getElementById('toolsModal').addEventListener('click', (e) => {
            if (e.target.id === 'toolsModal') closeTools();
        });

        // Escape key closes modal
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeTools();
        });

        // Focus input on load
        window.addEventListener('load', () => {
            document.getElementById('messageInput').focus();
        });
    </script>
</body>
</html>
